ddle" fill="#1c2b3a">género actual · reacción del público</text><path d="M420,259 L548,259" fill="none" stroke="#33475b" stroke-width="1.5" marker-end="url(#f)"/><rect x="40" y="327" width="380" height="96" rx="8" fill="#eaf2fb" stroke="#1f4e79" stroke-width="1.4"/><text x="230.0" y="360.6" font-size="14" text-anchor="middle" fill="#1c2b3a" font-weight="700">Catálogo del DJ</text><text x="230.0" y="379.5" font-size="14" text-anchor="middle" fill="#1c2b3a">género · BPM · tonalidad Camelot · energía</text><text x="230.0" y="398.4" font-size="14" text-anchor="middle" fill="#1c2b3a">conocida · comercial · formato</text><path d="M420,375 L548,375" fill="none" stroke="#33475b" stroke-width="1.5" marker-end="url(#f)"/><rect x="40" y="443" width="380" height="96" rx="8" fill="#eaf2fb" stroke="#1f4e79" stroke-width="1.4"/><text x="230.0" y="486.1" font-size="14" text-anchor="middle" fill="#1c2b3a" font-weight="700">Canción que suena</text><text x="230.0" y="505.0" font-size="14" text-anchor="middle" fill="#1c2b3a">elegida del catálogo</text><path d="M420,491 L548,491" fill="none" stroke="#33475b" stroke-width="1.5" marker-end="url(#f)"/><rect x="40" y="559" width="380" height="96" rx="8" fill="#eaf2fb" stroke="#1f4e79" stroke-width="1.4"/><text x="230.0" y="602.1" font-size="14" text-anchor="middle" fill="#1c2b3a" font-weight="700">Decisión del DJ</text><text x="230.0" y="621.0" font-size="14" text-anchor="middle" fill="#1c2b3a">aceptar · rechazar · modificar</text><path d="M420,607 L548,607" fill="none" stroke="#33475b" stroke-width="1.5" marker-end="url(#f)"/><rect x="980" y="95" width="380" height="96" rx="8" fill="#eaf2fb" stroke="#1f4e79" stroke-width="1.4"/><text x="1170.0" y="138.1" font-size="14" text-anchor="middle" fill="#1c2b3a" font-weight="700">Reglas activadas</text><text x="1170.0" y="157.0" font-size="14" text-anchor="middle" fill="#1c2b3a">con los hechos que las cumplen</text><path d="M850,143 L978,143" fill="none" stroke="#33475b" stroke-width="1.5" marker-end="url(#f)"/><rect x="980" y="211" width="380" height="96" rx="8" fill="#eaf2fb" stroke="#1f4e79" stroke-width="1.4"/><text x="1170.0" y="244.7" font-size="14" text-anchor="middle" fill="#1c2b3a" font-weight="700">Conflictos</text><text x="1170.0" y="263.6" font-size="14" text-anchor="middle" fill="#1c2b3a">subir frente a bajar la energía</text><text x="1170.0" y="282.4" font-size="14" text-anchor="middle" fill="#1c2b3a">(los resuelve el DJ)</text><path d="M850,259 L978,259" fill="none" stroke="#33475b" stroke-width="1.5" marker-end="url(#f)"/><rect x="980" y="327" width="380" height="96" rx="8" fill="#eaf2fb" stroke="#1f4e79" stroke-width="1.4"/><text x="1170.0" y="370.1" font-size="14" text-anchor="middle" fill="#1c2b3a" font-weight="700">Recomendaciones</text><text x="1170.0" y="389.0" font-size="14" text-anchor="middle" fill="#1c2b3a">canción sugerida y otras candidatas</text><path d="M850,375 L978,375" fill="none" stroke="#33475b" stroke-width="1.5" marker-end="url(#f)"/><rect x="980" y="443" width="380" height="96" rx="8" fill="#eaf2fb" stroke="#1f4e79" stroke-width="1.4"/><text x="1170.0" y="476.6" font-size="14" text-anchor="middle" fill="#1c2b3a" font-weight="700">Técnicas de transición</text><text x="1170.0" y="495.5" font-size="14" text-anchor="middle" fill="#1c2b3a">según la diferencia de BPM</text><text x="1170.0" y="514.4" font-size="14" text-anchor="middle" fill="#1c2b3a">y el cambio de género</text><path d="M850,491 L978,491" fill="none" stroke="#33475b" stroke-width="1.5" marker-end="url(#f)"/><rect x="980" y="559" width="380" height="96" rx="8" fill="#eaf2fb" stroke="#1f4e79" stroke-width="1.4"/><text x="1170.0" y="592.6" font-size="14" text-anchor="middle" fill="#1c2b3a" font-weight="700">Explicación e historial</text><text x="1170.0" y="611.5" font-size="14" text-anchor="middle" fill="#1c2b3a">por qué se recomendó</text><text x="1170.0" y="630.4" font-size="14" text-anchor="middle" fill="#1c2b3a">y qué decidió el DJ</text><path d="M850,607 L978